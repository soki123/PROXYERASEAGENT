[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tps-decoder-evaluation"
version = "0.1.0"
description = "Reproducible TPS/JPEG/VAE and gradient-based watermark robustness evaluation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=9.5",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
  "torch>=2.1",
  "torchvision>=0.16",
  "kornia>=0.7",
  "compressai>=1.2",
  "lpips>=0.1.4",
]

[tool.setuptools]
py-modules = []
